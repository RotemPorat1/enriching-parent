<div class="header">
  @for(img of headerImgArr; track img; ) {
  <div [class]="img.class">
    <img [src]="img.url" [alt]="img.alt" />
  </div>
  }
</div>
<div [class]="subHeaderImg.class">
  @if(isDesktop){
  <img [src]="subHeaderImg.url" [alt]="subHeaderImg.alt" />
  } @else{
  <div class="title-text custom-font-medium">
    @for (row of textRows; track row) {
    <div>
      <p [class.text-bold]="row.isBold">{{ row.text }}</p>
    </div>
    }
  </div>
  }
</div>
